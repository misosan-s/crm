# Vibe Mailer — Supabase 프로젝트 설정
# 자세한 설정 옵션: https://supabase.com/docs/guides/local-development/cli/config

project_id = "vibe-mailer"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false

[functions.trigger-action]
verify_jwt = true

# 미소산랩 일일 메일 발송 — cron(pg_net)이 x-cron-secret 헤더로 호출하므로 JWT 미검증.
# 보호는 MISOSAN_CRON_SECRET 시크릿으로 한다.
[functions.daily-lesson]
verify_jwt = false
